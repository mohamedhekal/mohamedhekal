name: Update GitHub signals

on:
  schedule:
    - cron: "17 5 * * 1"   # weekly, Monday 05:17 UTC
  workflow_dispatch:

# Least privilege: the job only needs to commit the refreshed README.
permissions:
  contents: write

concurrency:
  group: update-signals
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a full commit SHA (same pin used in the AgentProof CI).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refresh signals table
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_signals.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh GitHub signals"
          git push
