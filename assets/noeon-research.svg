<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t-noeon d-noeon"><title id="t-noeon">Noeon research concept</title><desc id="d-noeon">Noeon is a conceptual research project. Thesis: Proof-of-Thinking, AI Soul identity, and Proof-of-Morality. The proposed architecture of AI integration, zero-knowledge proofs, smart contracts and a blockchain core is drawn dashed because it is not built. No protocol code exists in the repository.</desc><defs><linearGradient id="bg-noeon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060B18"/><stop offset="1" stop-color="#0C1A36"/></linearGradient><radialGradient id="gl-noeon" cx="0.82" cy="0.12" r="0.7"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><radialGradient id="gv-noeon" cx="0.1" cy="0.95" r="0.6"><stop offset="0" stop-color="#9B8CFF" stop-opacity="0.14400000000000002"/><stop offset="1" stop-color="#9B8CFF" stop-opacity="0"/></radialGradient><pattern id="gr-noeon" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9FB0CB" stroke-opacity="0.05" stroke-width="1"/></pattern></defs><rect width="900" height="520" rx="18" fill="url(#bg-noeon)"/><rect width="900" height="520" rx="18" fill="url(#gr-noeon)"/><rect width="900" height="520" rx="18" fill="url(#gl-noeon)"/><rect width="900" height="520" rx="18" fill="url(#gv-noeon)"/><rect x="0.75" y="0.75" width="898.5" height="518.5" rx="17.5" fill="none" stroke="#26354F" stroke-width="1.5"/><text x="40" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#9B8CFF" text-anchor="start" letter-spacing="3">NOEON // RESEARCH</text><text x="40" y="94" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#EAF0FA" text-anchor="start">Proof-of-Thinking for ethical AI</text><text x="40" y="126" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#9FB0CB" text-anchor="start">A thesis, not a product.</text><rect x="40" y="152" width="400" height="300" rx="14" fill="#0E1A33" stroke="#26354F" stroke-width="1.5"/><path d="M54 152H426" stroke="#9B8CFF" stroke-width="3" stroke-linecap="round" fill="none"/><text x="60" y="190" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#9B8CFF" text-anchor="start" letter-spacing="2">THESIS</text><rect x="58" y="214" width="364" height="64" rx="10" fill="#13223F" stroke="#26354F" stroke-width="1.2"/><text x="74" y="242" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#EAF0FA" text-anchor="start">Proof-of-Thinking</text><text x="74" y="267" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0CB" text-anchor="start">verifiable AI reasoning</text><rect x="58" y="290" width="364" height="64" rx="10" fill="#13223F" stroke="#26354F" stroke-width="1.2"/><text x="74" y="318" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#EAF0FA" text-anchor="start">AI Soul identity</text><text x="74" y="343" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0CB" text-anchor="start">persistent, auditable reputation</text><rect x="58" y="366" width="364" height="64" rx="10" fill="#13223F" stroke="#26354F" stroke-width="1.2"/><text x="74" y="394" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#EAF0FA" text-anchor="start">Proof-of-Morality</text><text x="74" y="419" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0CB" text-anchor="start">ethical validation of outputs</text><rect x="460" y="152" width="400" height="300" rx="14" fill="#0E1A33" stroke="#26354F" stroke-width="1.5" stroke-dasharray="7 6"/><path d="M474 152H846" stroke="#F5B642" stroke-width="3" stroke-linecap="round" fill="none"/><text x="480" y="190" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#F5B642" text-anchor="start" letter-spacing="2">PROPOSED · NOT BUILT</text><rect x="480" y="214" width="360" height="46" rx="10" fill="none" stroke="#9FB0CB" stroke-width="1.4" stroke-dasharray="6 6"/><text x="660" y="244" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#9FB0CB" text-anchor="middle">AI integration</text><rect x="480" y="272" width="360" height="46" rx="10" fill="none" stroke="#9FB0CB" stroke-width="1.4" stroke-dasharray="6 6"/><text x="660" y="302" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#9FB0CB" text-anchor="middle">Zero-knowledge proofs</text><rect x="480" y="330" width="360" height="46" rx="10" fill="none" stroke="#9FB0CB" stroke-width="1.4" stroke-dasharray="6 6"/><text x="660" y="360" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#9FB0CB" text-anchor="middle">Smart contracts</text><rect x="480" y="388" width="360" height="46" rx="10" fill="none" stroke="#9FB0CB" stroke-width="1.4" stroke-dasharray="6 6"/><text x="660" y="418" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#9FB0CB" text-anchor="middle">Blockchain core</text><rect x="40" y="468" width="820" height="36" rx="18" fill="#13223F" stroke="#F5B642" stroke-width="1.5"/><text x="450" y="492" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F5B642" text-anchor="middle" letter-spacing="0.8">STATUS: CONCEPTUAL RESEARCH · NO PROTOCOL CODE IN THE REPOSITORY</text></svg>
