<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-labelledby="t-enterprise d-enterprise"><title id="t-enterprise">Enterprise reliability layers as open-source packages</title><desc id="d-enterprise">Open-source Laravel packages grouped in four lanes. Edge: apiforge, oncegate, payloadmask. Integration: integrator, hookrelay, event-outbox, lockguard. Domain: tenantforge, stockpulse, ordermachine, ledgercore, shipbridge. Governance: guardrail, flagdeck, audittrail, flowforge.</desc><defs><linearGradient id="bg-enterprise" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F9FD"/><stop offset="1" stop-color="#E8EEF8"/></linearGradient><radialGradient id="gl-enterprise" cx="0.82" cy="0.12" r="0.7"><stop offset="0" stop-color="#0E7490" stop-opacity="0.1"/><stop offset="1" stop-color="#0E7490" stop-opacity="0"/></radialGradient><radialGradient id="gv-enterprise" cx="0.1" cy="0.95" r="0.6"><stop offset="0" stop-color="#5B4BDB" stop-opacity="0.09000000000000001"/><stop offset="1" stop-color="#5B4BDB" stop-opacity="0"/></radialGradient><pattern id="gr-enterprise" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#44566F" stroke-opacity="0.07" stroke-width="1"/></pattern></defs><rect width="900" height="580" rx="18" fill="url(#bg-enterprise)"/><rect width="900" height="580" rx="18" fill="url(#gr-enterprise)"/><rect width="900" height="580" rx="18" fill="url(#gl-enterprise)"/><rect width="900" height="580" rx="18" fill="url(#gv-enterprise)"/><rect x="0.75" y="0.75" width="898.5" height="578.5" rx="17.5" fill="none" stroke="#C5D0E4" stroke-width="1.5"/><text x="40" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#0E7490" text-anchor="start" letter-spacing="3">ENTERPRISE SYSTEMS // OPEN SOURCE</text><text x="40" y="94" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#0B1630" text-anchor="start">One failure mode per package</text><text x="40" y="126" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#44566F" text-anchor="start">Laravel libraries with public code, tests and CI · PHP 8.2+</text><rect x="40" y="152" width="190" height="340" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M54 152H216" stroke="#0E7490" stroke-width="3" stroke-linecap="round" fill="none"/><text x="58" y="190" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0E7490" text-anchor="start" letter-spacing="1.2">EDGE</text><text x="58" y="216" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">clean contracts</text><rect x="54" y="238" width="162" height="40" rx="20.0" fill="#EEF3FB" stroke="#C5D0E4" stroke-width="1.2"/><text x="135.0" y="264.65" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="600" fill="#0B1630" text-anchor="middle">apiforge</text><rect x="54" y="288" width="162" height="40" rx="20.0" fill="#EEF3FB" stroke="#C5D0E4" stroke-width="1.2"/><text x="135.0" y="314.65" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="600" fill="#0B1630" text-anchor="middle">oncegate</text><rect x="54" y="338" width="162" height="40" rx="20.0" fill="#EEF3FB" stroke="#C5D0E4" stroke-width="1.2"/><text x="135.0" y="364.65" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="600" fill="#0B1630" text-anchor="middle">payloadmask</text><rect x="250" y="152" width="190" height="340" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M264 152H426" stroke="#5B4BDB" stroke-width="3" stroke-linecap="round" fill="none"/><text x="268" y="190" font-f