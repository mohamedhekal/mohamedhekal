<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t-chatprof d-chatprof"><title id="t-chatprof">ChatProf AI product overview</title><desc id="d-chatprof">ChatProf AI: a bilingual Arabic and English AI workspace. Flow: upload documents, process on the server with queues and storage, route to Smart or Prof mode, deliver answers, summaries and drafts. Includes plans, usage limits, payments and an admin dashboard.</desc><defs><linearGradient id="bg-chatprof" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F9FD"/><stop offset="1" stop-color="#E8EEF8"/></linearGradient><radialGradient id="gl-chatprof" cx="0.82" cy="0.12" r="0.7"><stop offset="0" stop-color="#0E7490" stop-opacity="0.1"/><stop offset="1" stop-color="#0E7490" stop-opacity="0"/></radialGradient><radialGradient id="gv-chatprof" cx="0.1" cy="0.95" r="0.6"><stop offset="0" stop-color="#5B4BDB" stop-opacity="0.09000000000000001"/><stop offset="1" stop-color="#5B4BDB" stop-opacity="0"/></radialGradient><pattern id="gr-chatprof" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#44566F" stroke-opacity="0.07" stroke-width="1"/></pattern></defs><rect width="900" height="480" rx="18" fill="url(#bg-chatprof)"/><rect width="900" height="480" rx="18" fill="url(#gr-chatprof)"/><rect width="900" height="480" rx="18" fill="url(#gl-chatprof)"/><rect width="900" height="480" rx="18" fill="url(#gv-chatprof)"/><rect x="0.75" y="0.75" width="898.5" height="478.5" rx="17.5" fill="none" stroke="#C5D0E4" stroke-width="1.5"/><text x="40" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#0E7490" text-anchor="start" letter-spacing="3">CHATPROF AI // PRODUCT</text><text x="40" y="94" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#0B1630" text-anchor="start">A bilingual AI workspace 