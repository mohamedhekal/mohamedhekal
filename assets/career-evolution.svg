<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t-career d-career"><title id="t-career">Career evolution</title><desc id="d-career">Four stages rising left to right: IT infrastructure, backend engineering, enterprise systems, and AI systems. Roles overlapped; the path shows direction, not a timeline.</desc><defs><linearGradient id="bg-career" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060B18"/><stop offset="1" stop-color="#0C1A36"/></linearGradient><radialGradient id="gl-career" cx="0.82" cy="0.12" r="0.7"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><radialGradient id="gv-career" cx="0.1" cy="0.95" r="0.6"><stop offset="0" stop-color="#9B8CFF" stop-opacity="0.14400000000000002"/><stop offset="1" stop-color="#9B8CFF" stop-opacity="0"/></radialGradient><pattern id="gr-career" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9FB0CB" stroke-opacity="0.05" stroke-width="1"/></pattern></defs><rect width="900" height="500" rx="18" fill="url(#bg-career)"/><rect width="900" height="500" rx="18" fill="url(#gr-career)"/><rect width="900" height="500" rx="18" fill="url(#gl-career)"/><rect width="900" height="500" rx="18" fill="url(#gv-career)"/><rect x="0.75" y="0.75" width="898.5" height="498.5" rx="17.5" fill="none" stroke="#26354F" stroke-width="1.5"/><text x="40" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#22D3EE" text-anchor="start" letter-spacing="3">CAREER EVOLUTION</text><text x="40" y="90" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#EAF0FA" text-anchor="start">Infrastructure first. Intelligence on top.</text><rect x="30" y="264" width="200" height="176" rx="14" fill="#0E1A33" stroke="#26354F" stroke-width="1.5"/><