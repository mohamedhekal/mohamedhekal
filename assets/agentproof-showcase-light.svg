<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-labelledby="t-agentproof d-agentproof"><title id="t-agentproof">AgentProof measured results</title><desc id="d-agentproof">AgentProof results on synthetic data. Unsafe outcomes at chaos 0.3 over 160 seeded runs per agent: naive scripted agent 28.1 percent, hardened scripted agent 0.0 percent. A recorded Claude run resolved 40 of 40 with 0 unsafe. Removing the refund-limit rule gave 12.5 percent unsafe; removing the idempotency-key API parameter gave 10.4 percent. Company Brain 99.9 versus 78.4 percent for RAG plus recency; calibrated autonomy 0.7 versus 13.7 percent bad auto-actions in simulation.</desc><defs><linearGradient id="bg-agentproof" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F9FD"/><stop offset="1" stop-color="#E8EEF8"/></linearGradient><radialGradient id="gl-agentproof" cx="0.82" cy="0.12" r="0.7"><stop offset="0" stop-color="#0E7490" stop-opacity="0.1"/><stop offset="1" stop-color="#0E7490" stop-opacity="0"/></radialGradient><radialGradient id="gv-agentproof" cx="0.1" cy="0.95" r="0.6"><stop offset="0" stop-color="#5B4BDB" stop-opacity="0.09000000000000001"/><stop offset="1" stop-color="#5B4BDB" stop-opacity="0"/></radialGradient><pattern id="gr-agentproof" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#44566F" stroke-opacity="0.07" stroke-width="1"/></pattern></defs><rect width="900" height="660" rx="18" fill="url(#bg-agentproof)"/><rect width="900" height="660" rx="18" fill="url(#gr-agentproof)"/><rect width="900" height="660" rx="18" fill="url(#gl-agentproof)"/><rect width="900" height="660" rx="18" fill="url(#gv-agentproof)"/><rect x="0.75" y="0.75" width="898.5" height="658.5" rx="17.5" fill="none" stroke="#C5D0E4" stroke-width="1.5"/><text x="40" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#0E7490" text-anchor="start" letter-spacing="3">AGENTPROOF // FLAGSHIP</text><text x="40" y="94" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#0B1630" text-anchor="start">Prove your agent survives production.</text><text x="40" y="126" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#44566F" text-anchor="start">Chaos testing · state-based grading · replay · reliability gate</text><rect x="40" y="152" width="400" height="282" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M54 152H426" stroke="#0E7490" stroke-width="3" stroke-linecap="round" fill="none"/><text x="60" y="192" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630" text-anchor="start">Unsafe outcomes at chaos 0.3</text><text x="60" y="218" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">160 seeded runs per agent</text><text x="60" y="262" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">naive scripted agent</text><rect x="60" y="272" width="250.00000000000003" height="34" rx="6" fill="#B45309"/><text x="322.0" y="299" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#B45309" text-anchor="start">28.1%</text><text x="60" y="340" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">hardened scripted agent</text><rect x="60" y="350" width="6" height="34" rx="3" fill="#0E7490"/><text x="78" y="377" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#0E7490" text-anchor="start">0.0%</text><line x1="60" y1="262" x2="60" y2="392" stroke="#C5D0E4" stroke-width="1.5" stroke-linecap="round"/><text x="60" y="414" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">hardened resolved 98.8% of tickets</text><rect x="460" y="152" width="195" height="134" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M474 152H641" stroke="#0E7490" stroke-width="3" stroke-linecap="round" fill="none"/><text x="476" y="204" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#0E7490" text-anchor="start">40/40</text><text x="476" y="236" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">Claude run resolved,</text><text x="476" y="260" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">0 unsafe</text><rect x="665" y="152" width="195" height="134" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M679 152H846" stroke="#B45309" stroke-width="3" stroke-linecap="round" fill="none"/><text x="681" y="204" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#B45309" text-anchor="start">12.5%</text><text x="681" y="236" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">unsafe without the</text><text x="681" y="260" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">refund-limit rule</text><rect x="460" y="296" width="195" height="134" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M474 296H641" stroke="#B45309" stroke-width="3" stroke-linecap="round" fill="none"/><text x="476" y="348" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#B45309" text-anchor="start">10.4%</text><text x="476" y="380" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">unsafe with no API</text><text x="476" y="404" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">idempotency key</text><rect x="665" y="296" width="195" height="134" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M679 296H846" stroke="#5B4BDB" stroke-width="3" stroke-linecap="round" fill="none"/><text x="681" y="348" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#5B4BDB" text-anchor="start">172</text><text x="681" y="380" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">recorded responses,</text><text x="681" y="404" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">replayable offline</text><rect x="40" y="452" width="410" height="112" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M54 452H436" stroke="#0F766E" stroke-width="3" stroke-linecap="round" fill="none"/><text x="58" y="494" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#0F766E" text-anchor="start">99.9% vs 78.4%</text><text x="58" y="522" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#0B1630" text-anchor="start">Company Brain vs RAG + recency</text><text x="58" y="548" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">synthetic data · rule-based extractor</text><rect x="470" y="452" width="390" height="112" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M484 452H846" stroke="#5B4BDB" stroke-width="3" stroke-linecap="round" fill="none"/><text x="488" y="494" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#5B4BDB" text-anchor="start">0.7% vs 13.7%</text><text x="488" y="522" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#0B1630" text-anchor="start">bad auto-actions, calibrated vs static</text><text x="488" y="548" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">simulation, 4000 actions</text><circle cx="46" cy="603" r="5" fill="#B45309"/><text x="60" y="609" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="start">Synthetic data · scripted reference agents · one live Claude run.</text><text x="60" y="637" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#0B1630" text-anchor="start">Limited controlled evaluations, not production-safety guarantees.</text></svg>
