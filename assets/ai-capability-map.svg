<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img" aria-labelledby="t-capability d-capability"><title id="t-capability">AI capability map</title><desc id="d-capability">Three pillars rest on an enterprise production foundation. Intelligence: LLMs and tool use, RAG and retrieval, memory and knowledge, bilingual Arabic and English. Orchestration: agents and tool loops, MCP and API tools, workflows and state, human escalation. Trust and safety: evals and chaos tests, replay and cassettes, security guardrails, human-in-the-loop. Foundation: backend and APIs, data and queues, cloud and networks, CI/CD and operations.</desc><defs><linearGradient id="bg-capability" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060B18"/><stop offset="1" stop-color="#0C1A36"/></linearGradient><radialGradient id="gl-capability" cx="0.82" cy="0.12" r="0.7"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><radialGradient id="gv-capability" cx="0.1" cy="0.95" r="0.6"><stop offset="0" stop-color="#9B8CFF" stop-opacity="0.14400000000000002"/><stop offset="1" stop-color="#9B8CFF" stop-opacity="0"/></radialGradient><pattern id="gr-capability" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9FB0CB" stroke-opacity="0.05" stroke-width="1"/></pattern></defs><rect width="900" height="720" rx="18" fill="url(#bg-capability)"/><rect width="900" height="720" rx="18" fill="url(#gr-capability)"/><rect width="900" height="720" rx="18" fill="url(#gl-capability)"/><rect width="900" height="720" rx="18" fill="url(#gv-capability)"/><rect x="0.75" y="0.75" width="898.5" height="718.5" rx="17.5" fill="none" stroke="#26354F" stroke-width="1.5"/><text x="40" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#22D3EE" text-anchor="start" letter-spacing="3">AI CAPABILITY MAP</text><text x="40" y="90" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#EAF0FA" text-anchor="start">Three pillars. One production foundation.</text><rect x="40" y="120" width="270" height="340" rx="14" fill="#0E1A33" stroke="#26354F" stroke-width="1.5"/><path d="M54 120H296" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" fill="none"/><text x="60" y="164" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#22D3EE" text-anchor="start" letter-spacing="1.5">INTELLIGENCE</text><text x="60" y="194" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#9FB0CB" text-anchor="start">Understand &amp; remember</text><rect x="56" y="218" width="238" height="46" rx="10" fill="#13223F" stroke="#22D3EE" stroke-width="1.2"/><text x="175.0" y="248.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#EAF0FA" text-anchor="middle">LLMs &amp; tool use</text><rect x="56" y="276" width="238" height="46" rx="10" fill="#13223F" stroke="#22D3EE" stroke-width="1.2"/><text x="175.0" y="306.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#EAF0FA" text-anchor="middle">RAG &amp; retrieval</text><rect x="56" y="334" width="238" height="46" rx="10" fill="#13223F" stroke="#22D3EE" stroke-width="1.2"/><text x="175.0" y="364.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#EAF0FA" text-anchor="middle">Memory &amp; knowledge</text><rect x="56" y="392" width="238" height="46" rx="10" fill="#13223F" stroke="#22D3EE" stroke-width="1.2"/><text x="175.0" y="422.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#EAF0FA" text-anchor="middle">Bilingual AR / EN</text><line x1="175.0" y1="460" x2="175.0" y2="500" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/><rect x="325" y="120" width="270" height="340" rx="14" fill="#0E1A33" stroke="#26354F" stroke-width="1.5"/><path d="M339 120H581" stroke="#9B8CFF" stroke-width="3" stroke-linecap="round" fill="none"/><text x="345" y="164" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#9B8CFF" text-anchor="start" letter-spacing="1.5">ORCHESTRATION</text><text x="345" y="194" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#9FB0CB" text-anchor="start">Decide &amp; act</text><rect x="341" y="218" width="238" height="46" rx="10" fill="#13223F" stroke="#9B8CFF" stroke-width="1.2"/><text x="460.0" y="248.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#EAF0FA" text-anchor="middle">Agents &amp; tool loops</text><rect x="341" y="276" width="238" height="46" rx="10" fill="#13223F" stroke="#9B8CFF" stroke-width="1.2"/><text x="460.0" y="306.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#EAF0FA" text-anchor="middle">MCP &amp; API tools</text><rect x="341" y="334" width="238" height="46" rx="10" fill="#13223F" stroke="#9B8CFF" stroke-width="1.2"/><text x="460.0" y="364.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#EAF0FA" text-anchor="middle">Workflows &amp; state</text><rect x="341" y="392" width="238" height="46" rx="10" fill="#13223F" stroke="#9B8CFF" stroke-width="1.2"/><text x="460.0" y="422.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#EAF0FA" text-anchor="middl