t><line x1="745.0" y1="460" x2="745.0" y2="500" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/><rect x="40" y="500" width="840" height="170" rx="14" fill="#0E1A33" stroke="#F5B642" stroke-width="2"/><text x="64" y="544" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#F5B642" text-anchor="start" letter-spacing="1.5">ENTERPRISE PRODUCTION</text><text x="64" y="574" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#9FB0CB" text-anchor="start">The part most AI demos skip</text><rect x="60" y="598" width="192" height="50" rx="10" fill="#13223F" stroke="#26354F" stroke-width="1.2"/><text x="156.0" y="630.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#EAF0FA" text-anchor="middle">Backend &amp; APIs</text><rect x="264" y="598" width="192" height="50" rx="10" fill="#13223F" stroke="#26354F" stroke-width="1.2"/><text x="360.0" y="630.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#EAF0FA" text-anchor="middle">Data &amp; queues</text><rect x="468" y="598" width="192" height="50" rx="10" fill="#13223F" stroke="#26354F" stroke-width="1.2"/><text x="564.0" y="630.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#EAF0FA" text-anchor="middle">Cloud &amp; networks</text><rect x="672" y="598" width="192" height="50" rx="10" fill="#13223F" stroke="#26354F" stroke-width="1.2"/><text x="768.0" y="630.35" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#EAF0FA" text-anchor="middle">CI/CD &amp; ops</text></svg>
