<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" role="img" aria-labelledby="t-agentarch d-agentarch"><title id="t-agentarch">Reference architecture for production AI agents</title><desc id="d-agentarch">Channels feed a gateway, an orchestrator and tools or MCP servers that act on systems of record. Knowledge, guardrails, memory and a human approval queue attach to the orchestrator and tools. A trust loop of chaos tests, state grading, replay and a CI reliability gate runs over everything, on a foundation of queues, databases, cloud, observability, secrets and audit.</desc><defs><linearGradient id="bg-agentarch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F9FD"/><stop offset="1" stop-color="#E8EEF8"/></linearGradient><radialGradient id="gl-agentarch" cx="0.82" cy="0.12" r="0.7"><stop offset="0" stop-color="#0E7490" stop-opacity="0.1"/><stop offset="1" stop-color="#0E7490" stop-opacity="0"/></radialGradient><radialGradient id="gv-agentarch" cx="0.1" cy="0.95" r="0.6"><stop offset="0" stop-color="#5B4BDB" stop-opacity="0.09000000000000001"/><stop offset="1" stop-color="#5B4BDB" stop-opacity="0"/></radialGradient><pattern id="gr-agentarch" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#44566F" stroke-opacity="0.07" stroke-width="1"/></pattern></defs><rect width="900" height="690" rx="18" fill="url(#bg-agentarch)"/><rect width="900" height="690" rx="18" fill="url(#gr-agentarch)"/><rect width="900" height="690" rx="18" fill="url(#gl-agentarch)"/><rect width="900" height="690" rx="18" fill="url(#gv-agentarch)"/><rect x="0.75" y="0.75" width="898.5" height="688.5" rx="17.5" fill="none" stroke="#C5D0E4" stroke-width="1.5"/><text x="40" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#0E7490" text-anchor="start" letter-spacing="3">REFERENCE ARCHITECTURE</text><text x="40" y="90" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#0B1630" text-anchor="start">How an agent earns the right to act</text><rect x="40" y="130" width="190" height="84" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M54 130H216" stroke="#44566F" stroke-width="3" stroke-linecap="round" fill="none"/><text x="135.0" y="168.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630" text-anchor="middle">Channels</text><text x="135.0" y="196.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="middle">web · chat · events</text><rect x="255" y="130" width="190" height="84" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M269 130H431" stroke="#0E7490" stroke-width="3" stroke-linecap="round" fill="none"/><text x="350.0" y="168.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630" text-anchor="middle">Knowledge</text><text x="350.0" y="196.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="middle">RAG · documents</text><rect x="470" y="130" width="190" height="84" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M484 130H646" stroke="#B45309" stroke-width="3" stroke-linecap="round" fill="none"/><text x="565.0" y="168.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630" text-anchor="middle">Guardrails</text><text x="565.0" y="196.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="middle">limits · allowlists</text><rect x="40" y="270" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M54 270H216" stroke="#0E7490" stroke-width="3" stroke-linecap="round" fill="none"/><text x="135.0" y="316.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630" text-anchor="middle">Gateway</text><text x="135.0" y="344.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="middle">auth · idempotency</text><rect x="255" y="270" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M269 270H431" stroke="#5B4BDB" stroke-width="3" stroke-linecap="round" fill="none"/><text x="350.0" y="316.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630" text-anchor="middle">Orchestrator</text><text x="350.0" y="344.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="middle">plan · route · retry</text><rect x="470" y="270" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M484 270H646" stroke="#0E7490" stroke-width="3" stroke-linecap="round" fill="none"/><text x="565.0" y="316.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630" text-anchor="middle">Tools / MCP</text><text x="565.0" y="344.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="middle">APIs · writes</text><rect x="685" y="270" width="175" height="100" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M699 270H846" stroke="#44566F" stroke-width="3" stroke-linecap="round" fill="none"/><text x="772.5" y="316.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630" text-anchor="middle">Systems</text><text x="772.5" y="344.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="middle">ERP · pay · ship</text><rect x="255" y="416" width="190" height="84" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M269 416H431" stroke="#0E7490" stroke-width="3" stroke-linecap="round" fill="none"/><text x="350.0" y="454.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630" text-anchor="middle">Memory</text><text x="350.0" y="482.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="middle">claims · history</text><rect x="470" y="416" width="190" height="84" rx="14" fill="#FFFFFF" stroke="#C5D0E4" stroke-width="1.5"/><path d="M484 416H646" stroke="#0F766E" stroke-width="3" stroke-linecap="round" fill="none"/><text x="565.0" y="454.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630" text-anchor="middle">Human approval</text><text x="565.0" y="482.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#44566F" text-anchor="middle">escalate · sign off</text><line x1="232" y1="320.0" x2="253" y2="320.0" stroke="#44566F" stroke-width="2.5" stroke-linecap="round"/><path d="M244 314.0L253 320.0L244 326.0" fill="none" stroke="#44566F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="447" y1="320.0" x2="468" y2="320.0" stroke="#44566F" stroke-width="2.5" stroke-linecap="round"/><path d="M459 314.0L468 320.0L459 326.0" fill="none" stroke="#44566F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="662" y1="320.0" x2="683" y2="320.0" stroke="#44566F" stroke-width="2.5" stroke-linecap="round"/><path d="M674 314.0L683 320.0L674 326.0" fill="none" stroke="#44566F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="135" y1="214" x2="135" y2="268" stroke="#44566F" stroke-width="2.5" stroke-linecap="round"/><path d="M129 259L135 268L141 259" fill="none" stroke="#44566F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="350" y1="214" x2="350" y2="268" stroke="#44566F" stroke-width="2.5" stroke-linecap="round"/><path d="M344 259L350 268L356 259" fill="none" stroke="#44566F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="565" y1="214" x2="565" y2="268" stroke="#44566F" stroke-width="2.5" stroke-linecap="round"/><path d="M559 259L565 268L571 259" fill="none" stroke="#44566F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="350" y1="416" x2="350" y2="372" stroke="#44566F" stroke-width="2.5" stroke-linecap="round"/><path d="M344 381L350 372L356 381" fill="none" stroke="#44566F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="565" y1="416" x2="565" y2="372" stroke="#44566F" stroke-width="2.5" stroke-linecap="round"/><path d="M559 381L565 372L571 381" fill="none" stroke="#44566F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="520" width="820" height="70" rx="12" fill="#EEF3FB" stroke="#5B4BDB" stroke-width="1.8"/><text x="60" y="550" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#5B4BDB" text-anchor="start" letter-spacing="2">TRUST LOOP</text><text x="60" y="576" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#0B1630" text-anchor="start">chaos tests → state grading → replay → CI reliability gate</text><rect x="40" y="604" width="820" height="70" rx="12" fill="#EEF3FB" stroke="#B45309" stroke-width="1.8"/><text x="60" y="634" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#B45309" text-anchor="start" letter-spacing="2">PRODUCTION FOUNDATION</text><text x="60" y="660" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#0B1630" text-anchor="start">queues · databases · cloud · observability · secrets · audit</text></svg>
